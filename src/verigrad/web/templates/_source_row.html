<div class="flex flex-col gap-2 sm:flex-row" data-source-row>
  <input type="url" name="url" value="{{ row.url }}" placeholder="https://university.edu/programme"
         class="min-w-0 flex-1 rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
  <select name="role" aria-label="Role of this URL"
          class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none">
    {% for role in roles %}
    <option value="{{ role }}" {% if role == row.role %}selected{% endif %}>{{ role }}</option>
    {% endfor %}
  </select>
</div>
